# Runs one Cosmos X1 test on many brains (seeds) at once, each on its own machine.
name: tests
on:
  workflow_dispatch:
    inputs:
      args:
        description: Arguments for cosmos_x1 without the seed
        required: true
        default: --test pairload --store-ticks 16 --preset dev
      seeds:
        description: Brains to test, as a list like [22,23,24]
        required: true
        default: "[22,23,24,25]"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - name: Run
        env:
          ARGS: ${{ inputs.args }}
          SEED: ${{ matrix.seed }}
        run: |
          export OMP_NUM_THREADS=$(nproc)
          ./build/cosmos_x1 $ARGS --seed $SEED | tee result_$SEED.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-seed-${{ matrix.seed }}
          path: result_${{ matrix.seed }}.txt
