# Time chamber: one brain follows a learning plan, one step per run. Each run restores the brain
# saved by the run before, does its step, grades it, saves the brain and starts the next step.
# Exactly the same as one long uninterrupted run (checked).
# Plan: space-separated steps; "A3" = word list A, 3 passes (one run each); "tA" = only test list A
# (does the brain still remember it?). Example: "A3 B3 tA" learns list A, then list B, then tests A.
# Start:  gh workflow run chamber.yml -f seed=3004 -f plan="A3 B3 tA"
name: chamber
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Brain (seed)
        default: "3004"
      plan:
        description: Learning plan (e.g. "A3 B3 tA")
        default: "A6"
      words:
        description: Word pairs per list (300 words = 150)
        default: "150"
      preset:
        description: Brain size (dev, or mid = about 8 GB)
        default: "dev"
      step:
        description: This run's step (1 = a new brain)
        default: "1"
      prev_run:
        description: Run that saved the brain to continue (empty for step 1)
        default: ""
      test:
        description: pairload (word pairs) or vocabpass (every word on its own)
        default: "pairload"
permissions:
  contents: read
  actions: write
jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build.sh
      - name: Restore the brain
        if: inputs.prev_run != ''
        uses: actions/download-artifact@v4
        with:
          name: brain-${{ inputs.seed }}
          run-id: ${{ inputs.prev_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Do this step and grade
        id: s
        env:
          NCM_PAIR_FAST: "1"
          NCM_PASS_TESTS: "1"
          NCM_PASSES: "1"
          PLAN: ${{ inputs.plan }}
          STEP: ${{ inputs.step }}
        run: |
          export OMP_NUM_THREADS=$(nproc)
          steps=()
          for tok in $PLAN; do
            if [[ $tok == t* ]]; then steps+=("$tok")
            else L=${tok:0:1}; n=${tok:1}; for k in $(seq 1 $n); do steps+=("$L$k"); done; fi
          done
          cur=${steps[$((STEP-1))]}
          echo "total=${#steps[@]}" >> "$GITHUB_OUTPUT"
          echo "cur=$cur" >> "$GITHUB_OUTPUT"
          if [[ $cur == t* ]]; then export NCM_WORDLIST=${cur:1} NCM_TEST_ONLY=1
          else export NCM_WORDLIST=${cur:0:1} NCM_PASS_START=${cur:1}; fi
          echo "step $STEP of ${#steps[@]}: $cur"
          if [ -f brain.bin.zst ]; then zstd -d -q --rm brain.bin.zst && export NCM_STATE_IN=brain.bin; fi
          if [ "${{ inputs.test }}" = vocabpass ]; then
            NCM_STATE_OUT=brain-next.bin ./build/cosmos_x1 --test vocabpass --preset ${{ inputs.preset }} --seed ${{ inputs.seed }} | tee result_step${STEP}_${cur}.txt
          else
            NCM_STATE_OUT=brain-next.bin ./build/cosmos_x1 --test pairload --store-ticks ${{ inputs.words }} --preset ${{ inputs.preset }} --seed ${{ inputs.seed }} | tee result_step${STEP}_${cur}.txt
          fi
          rm -f brain.bin
          mv brain-next.bin brain.bin
          zstd -3 -T0 -q --rm brain.bin
          ls -la brain.bin.zst
      - uses: actions/upload-artifact@v4
        with:
          name: brain-${{ inputs.seed }}
          path: brain.bin.zst
          compression-level: 0
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: result-seed-${{ inputs.seed }}-step${{ inputs.step }}
          path: result_step*.txt
      - name: Start the next step
        if: fromJSON(inputs.step) < fromJSON(steps.s.outputs.total)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run chamber.yml -R ${{ github.repository }} --ref ${{ github.ref_name }} \
            -f seed=${{ inputs.seed }} -f plan="${{ inputs.plan }}" -f words=${{ inputs.words }} -f preset=${{ inputs.preset }} \
            -f step=$(( ${{ inputs.step }} + 1 )) -f prev_run=${{ github.run_id }} -f test=${{ inputs.test }}
